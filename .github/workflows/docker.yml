# Baut bei jedem Push auf main das fertige Docker-Image und legt es in der GitHub Container Registry ab:
#   ghcr.io/<besitzer>/<repository>:latest      (immer der neueste Stand von main)
#   ghcr.io/<besitzer>/<repository>:sha-<hash>  (jeder Stand einzeln, zum Zurückgehen)
# Bestehende Installationen können :latest automatisch aktualisieren (siehe README).
name: Docker-Image

on:
  push:
    branches: [main]
    # CHANGELOG.md wird im Frontend gebündelt und muss einen Image-Build auslösen.
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '.env.example'
  pull_request:
  workflow_dispatch:

# Nur Läufe desselben Branches bzw. Pull Requests ersetzen.
concurrency:
  group: docker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server-Tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Client-Tests
        working-directory: client
        run: |
          npm ci
          npm test
          npm run build
      - name: Kiosk-Agent-Tests
        working-directory: kiosk-agent
        run: python3 -m unittest discover -s tests
      - name: Generische Compose-Konfiguration prüfen
        run: docker compose -f docker-compose.generic.yml config -q

  image:
    name: Image bauen und veröffentlichen
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # für das arm64-Image auf ARM-Systemen
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Dockerfile.full baut Frontend und Server komplett im Build (Node 22, npm ci);
      # die zugehörige Ignore-Datei ist Dockerfile.full.dockerignore
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
