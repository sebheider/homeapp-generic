# HomeApp – docker compose / Synology Container Manager (Projekt)
#
# Ablage auf der Synology: /volume1/docker/HomeApp (Inhalt des Repositories, z. B. per git clone oder
# GitHub → Code → Download ZIP)
# Start:  cd /volume1/docker/HomeApp && sudo docker compose up -d --build
# Danach: https://<IP-der-Synology>:8095
#
# Docker baut dabei alles selbst (npm-Pakete und Frontend), vorher muss nichts erstellt werden. Nur bei
# „npm error Exit handler never called!“ (ältere Docker-Versionen) siehe README → Fehlersuche.
#
# Der Ordner ./data (= /volume1/docker/HomeApp/data) muss existieren – er ist im Repository bereits
# (leer) enthalten; der Container Manager legt ihn nicht selbst an. Er nimmt Konfiguration, Zugangsdaten,
# Verlauf und externe Module auf.
#
# GGF. ANPASSEN – vor allem, wenn auf dem Host schon eine HomeApp oder ein anderes Projekt läuft:
#   - Host-Port:      HOMEAPP_PORT in .env (Standard 8095) oder direkt unten unter "ports"
#   - Containername:  container_name (Standard "homeapp"); muss auf dem Host eindeutig sein
#   - Netzwerk:       Name homeapp_net, Subnetz 172.40.0.0/24, Gateway und ipv4_address (ganz unten bzw.
#                     unter "networks"); das Subnetz darf sich mit keinem anderen Docker-Netz überschneiden
#   - Image-Name:     image (Standard homeapp:latest), damit nicht zwei Projekte dasselbe Image überschreiben
#   - Projektordner / Projektname im Container Manager: eigener Ordner je Installation
services:
  homeapp:
    build: .
    image: homeapp:latest
    container_name: homeapp
    restart: unless-stopped
    ports:
      # links: Port auf der Synology (8080 ist dort häufig belegt; über HOMEAPP_PORT in .env änderbar),
      # rechts: Port im Container (nicht ändern)
      - "${HOMEAPP_PORT:-8095}:8080"
    # Feste IP im eigenen Docker-Netzwerk (siehe "networks" unten): 172.40.0.10
    # Erreichbar ist sie von der Synology selbst und von anderen Containern im selben Netzwerk
    # (z. B. https://172.40.0.10:8080). Aus dem LAN weiterhin über https://<IP-der-Synology>:8095.
    networks:
      homeapp_net:
        ipv4_address: 172.40.0.10
    volumes:
      # Konfiguration (config.json) und Verlaufsdaten (history.json)
      - ./data:/data
    # Optionale Werte: Compose liest eine vorhandene Datei ".env" neben dieser Datei automatisch
    # und setzt sie hier ein. Fehlt die Datei, bleiben die Werte leer (= nicht gesetzt).
    # Integrationen lassen sich auch in der App unter "Einstellungen" eintragen.
    environment:
      TZ: Europe/Berlin
      HTTPS: ${HTTPS:-}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      IOBROKER_HOST: ${IOBROKER_HOST:-}
      IOBROKER_PORT: ${IOBROKER_PORT:-}
      IOBROKER_SECURE: ${IOBROKER_SECURE:-}
      IOBROKER_PROTOCOL: ${IOBROKER_PROTOCOL:-}
      IOBROKER_USER: ${IOBROKER_USER:-}
      IOBROKER_PASSWORD: ${IOBROKER_PASSWORD:-}
      IOBROKER_VERIFY_SSL: ${IOBROKER_VERIFY_SSL:-}
      SS_HOST: ${SS_HOST:-}
      SS_PORT: ${SS_PORT:-}
      SS_HTTPS: ${SS_HTTPS:-}
      SS_ACCOUNT: ${SS_ACCOUNT:-}
      SS_PASSWORD: ${SS_PASSWORD:-}
      SS_VERIFY_SSL: ${SS_VERIFY_SSL:-}

# Eigenes Bridge-Netzwerk 172.40.0.0/24 (Gateway 172.40.0.1); der Container bekommt 172.40.0.10.
# Meldet Docker „Pool overlaps with other one on this address space“ oder läuft bereits eine zweite
# HomeApp mit diesem Netz, gibt es zwei Wege:
#   a) eigenes, freies Subnetz – dann alle drei Werte zusammen ändern, z. B. subnet 172.41.0.0/24,
#      gateway 172.41.0.1 und oben ipv4_address 172.41.0.10;
#   b) ein vorhandenes Netzwerk mitbenutzen (ipv4_address muss darin frei sein) – Block ersetzen durch:
#   networks:
#     homeapp_net:
#       external: true
#       name: <Name-des-vorhandenen-Netzwerks>
networks:
  homeapp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1
